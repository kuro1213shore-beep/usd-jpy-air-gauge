<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FX CORE</title>

<style>
body{
  margin:0;
  background:#111;
  color:#00ffc3;
  font-family:monospace;
  text-align:center;
}
.container{
  padding:20px;
}
h1{
  margin-top:10px;
}
.box{
  border:2px solid #00ffc3;
  padding:15px;
  margin:15px 0;
}
input{
  width:80px;
  padding:5px;
  background:#000;
  border:1px solid #00ffc3;
  color:#00ffc3;
  text-align:center;
}
button{
  margin-top:20px;
  padding:12px 25px;
  background:#111;
  border:2px solid #ff004c;
  color:#ff004c;
  font-size:16px;
}
button:hover{
  background:#ff004c;
  color:#111;
}
.small{
  font-size:12px;
  margin-top:20px;
  color:#888;
}
</style>
</head>

<body>
<div class="container">

<h1>FX CORE</h1>

<div class="box">
SP500 % <input id="sp" type="number" step="0.1"><br><br>
VIX % <input id="vix" type="number" step="0.1"><br><br>
TLT % <input id="tlt" type="number" step="0.1"><br><br>
USD INDEX % <input id="dxy" type="number" step="0.1"><br><br>
RSI <input id="rsi" type="number">
</div>

<div class="box">ENV: <span id="env">--</span></div>
<div class="box">DIR: <span id="dir">--</span></div>
<div class="box">RSI SIGNAL: <span id="rsisig">--</span></div>
<div class="box">ORDER: <span id="order">--</span></div>

<button onclick="analyze()">ANALYZE</button>

<div class="small">
※ 数値を入力して相場状態を再現
</div>

</div>

<script>

function analyze(){

  let sp = parseFloat(document.getElementById("sp").value);
  let vix = parseFloat(document.getElementById("vix").value);
  let tlt = parseFloat(document.getElementById("tlt").value);
  let dxy = parseFloat(document.getElementById("dxy").value);
  let rsi = parseFloat(document.getElementById("rsi").value);

  // ENV判定
  let env = "NEUTRAL";
  if(sp > 0 && vix < 0) env = "RISK ON";
  if(sp < 0 && vix > 0) env = "RISK OFF";

  // DIR判定
  let dir = "RANGE";
  if(dxy > 0 && tlt < 0) dir = "USD STRONG";
  if(dxy < 0 && tlt > 0) dir = "USD WEAK";

  // RSI判定
  let rsiSignal = "NORMAL";
  if(rsi < 30) rsiSignal = "OVERSOLD";
  if(rsi > 70) rsiSignal = "OVERBOUGHT";

  // ORDER判定
  let order = "NO TRADE";
  if(env=="RISK ON" && rsiSignal=="OVERSOLD") order="LONG";
  if(env=="RISK OFF" && rsiSignal=="OVERBOUGHT") order="SHORT";

  document.getElementById("env").innerText = env;
  document.getElementById("dir").innerText = dir;
  document.getElementById("rsisig").innerText = rsiSignal;
  document.getElementById("order").innerText = order;
}

</script>

</body>
</html>
