<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX CORE</title>

<style>
body{
  margin:0;
  background:#111;
  color:#00ffcc;
  font-family:monospace;
  text-align:center;
}

h1{
  margin-top:40px;
  font-size:28px;
  letter-spacing:3px;
}

.container{
  padding:20px;
}

.box{
  border:2px solid #00ffcc;
  margin:15px 0;
  padding:20px;
  font-size:18px;
  transition:0.3s;
}

.green{ color:#00ffcc; border-color:#00ffcc; }
.red{ color:#ff3b3b; border-color:#ff3b3b; }
.blue{ color:#3ba6ff; border-color:#3ba6ff; }
.gray{ color:#888; border-color:#555; }

button{
  margin-top:20px;
  padding:15px 30px;
  font-size:16px;
  background:#111;
  border:2px solid #ff3b3b;
  color:#ff3b3b;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#ff3b3b;
  color:#111;
}
.note{
  margin-top:20px;
  font-size:12px;
  color:#666;
}
</style>
</head>

<body>

<h1>FX CORE</h1>

<div class="container">

  <div id="env" class="box gray">ENV: --</div>
  <div id="dir" class="box gray">DIR: --</div>
  <div id="rsi" class="box gray">RSI: --</div>
  <div id="order" class="box gray">ORDER: --</div>

  <button onclick="simulate()">SIMULATE</button>

  <div class="note">
    ※現在は疑似相場。次にAPI接続可能。
  </div>

</div>

<script>

function simulate(){

  // 疑似マーケット生成
  const sp = random(-2,2)
  const vix = random(-2,2)
  const tlt = random(-2,2)
  const usd = random(-1,1)
  const rsiValue = Math.floor(Math.random()*100)

  const envBox = document.getElementById("env")
  const dirBox = document.getElementById("dir")
  const rsiBox = document.getElementById("rsi")
  const orderBox = document.getElementById("order")

  // ===== ENV 判定（リスク環境） =====
  let envState = "MIXED"
  envBox.className = "box gray"

  if(sp > 0 && vix < 0 && tlt < 0){
    envState = "RISK ON"
    envBox.className = "box red"
  }
  else if(sp < 0 && vix > 0 && tlt > 0){
    envState = "RISK OFF"
    envBox.className = "box blue"
  }

  envBox.innerHTML = "ENV: " + envState

  // ===== DIR 判定（ドル円方向） =====
  let dirState = "NEUTRAL"
  dirBox.className = "box gray"

  if(usd > 0.3){
    dirState = "LONG"
    dirBox.className = "box red"
  }
  else if(usd < -0.3){
    dirState = "SHORT"
    dirBox.className = "box blue"
  }

  dirBox.innerHTML = "DIR: " + dirState

  // ===== RSI =====
  rsiBox.innerHTML = "RSI: " + rsiValue

  if(rsiValue > 70){
    rsiBox.className = "box red"
  }
  else if(rsiValue < 30){
    rsiBox.className = "box blue"
  }
  else{
    rsiBox.className = "box green"
  }

  // ===== ORDER ロジック（逆張りベース） =====
  let order = "WAIT"
  orderBox.className = "box gray"

  if(envState === "RISK ON" && rsiValue < 30){
    order = "LONG"
    orderBox.className = "box red"
  }
  else if(envState === "RISK OFF" && rsiValue > 70){
    order = "SHORT"
    orderBox.className = "box blue"
  }

  orderBox.innerHTML = "ORDER: " + order
}


// ===== Utility =====
function random(min,max){
  return Math.random()*(max-min)+min
}

</script>

</body>
</html>
